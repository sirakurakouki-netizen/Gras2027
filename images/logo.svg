<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
	<defs>
		<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0" stop-color="#2e4046"/>
			<stop offset="1" stop-color="#47565e"/>
		</linearGradient>
		<clipPath id="pill">
			<rect x="30" y="26" width="452" height="112" rx="56"/>
		</clipPath>
	</defs>

	<rect width="512" height="512" fill="url(#bg)"/>

	<!-- top navigation pill -->
	<rect x="30" y="26" width="452" height="112" rx="56" fill="#0d0d0d"/>
	<g clip-path="url(#pill)">
		<rect x="30" y="26" width="110" height="112" fill="#161616"/>
		<rect x="144" y="26" width="106" height="112" fill="#212121"/>
		<rect x="254" y="26" width="106" height="112" fill="#212121"/>
		<rect x="364" y="26" width="118" height="112" fill="#212121"/>
	</g>
	<rect x="30" y="26" width="452" height="112" rx="56" fill="none" stroke="#000000" stroke-opacity="0.55" stroke-width="4"/>

	<!-- game grid -->
	<g fill="#050505">
		<rect x="60" y="190" width="108" height="108"/>
		<rect x="202" y="190" width="108" height="108"/>
		<rect x="344" y="190" width="108" height="108"/>
		<rect x="60" y="350" width="108" height="108"/>
		<rect x="202" y="350" width="108" height="108"/>
		<rect x="344" y="350" width="108" height="108"/>
	</g>
</svg>
